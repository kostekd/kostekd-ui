name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/kostekd/kostekd-ui

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ghcr.io/kostekd/kostekd-ui:latest
            docker stop kostekd-ui 2>/dev/null || true
            docker rm kostekd-ui 2>/dev/null || true
            docker run -d \
              --name kostekd-ui \
              --restart unless-stopped \
              --network vps_net \
              -e HOST=0.0.0.0 \
              -e PORT=4321 \
              -e VIRTUAL_HOST=kostekd.com \
              -e VIRTUAL_PORT=4321 \
              ghcr.io/kostekd/kostekd-ui:latest
            docker image prune -f
